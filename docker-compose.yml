services:
  postgres:
    image: postgres:16-alpine
    container_name: inblackm_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_tracking_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_tracking_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - inblackm-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inblackm_order_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: order_tracking_db
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/order_tracking_db
      BOT_LEASE_DURATION_SECONDS: 30
      BOT_HEARTBEAT_INTERVAL_SECONDS: 10
      BOT_MAX_RETRIES: 3
      PAYMENT_EXPIRY_MINUTES: 15
      SLA_QUEUE_TIMEOUT_SECONDS: 120
      RECOVERY_WORKER_INTERVAL_SECONDS: 5
      WEBHOOK_SECRET: inblackm_bank_webhook_secret_key_2026
    ports:
      - "3000:3000"
    networks:
      - inblackm-network

volumes:
  pgdata:
    driver: local

networks:
  inblackm-network:
    driver: bridge
